name: Triggered Attendance Fetch

on:
  repository_dispatch:
    types: [trigger-fetch] # 接收來自 HTML 的自定義事件
  workflow_dispatch: # 保留手動觸發按鈕

jobs:
  run-python:
    runs-on: ubuntu-latest
    # 若為公司內網，請改為自託管執行器：
    # runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Fetch Script
        env:
          SSRS_USER: ${{ secrets.SSRS_USER }}
          SSRS_PASS: ${{ secrets.SSRS_PASS }}
        run: |
          python fetch_data.py

      - name: Commit and Push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update data from HTML trigger [skip ci]" && git push)