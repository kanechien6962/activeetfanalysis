
name: Schedule Diagnostic

on:
  schedule:
    - cron: "7,12,17,22,27,32,37,42,47,52,57 * * * *"
      timezone: 'Asia/Taipei'
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm schedule trigger
        run: |
          echo "Workflow triggered successfully"
          echo "Event: $GITHUB_EVENT_NAME"
          date -u
