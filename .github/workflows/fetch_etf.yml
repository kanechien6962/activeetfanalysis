name: Fetch ETF Portfolio

on:
  schedule:
    # UTC 10:00 = 台灣時間 18:18，週一到週五
    # - cron: "7 10 * * 1-5"
    - cron: "*/5 * * * * *"
  workflow_dispatch: # 可手動觸發測試

permissions:
  contents: write # 需要權限把結果 commit 回 repo

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download Excel and convert to JSON
        run: python etf_pipeline.py

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p ETF_Data
          # 加入整個資料夾但排除 xlsx：即使當天沒有產生報表也不會報錯，
          # 而且被刪除的舊報表也會一併 stage
          git add -A -- ETF_Data ':(exclude)ETF_Data/*.xlsx'
          if git diff --cached --quiet; then
            echo "沒有變更，略過 commit"
          else
            git commit -m "chore: update ETF data $(TZ=Asia/Taipei date +%F)"
            git push
          fi
