    // Event Bindings
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById('btnFetchGithub').addEventListener('click', fetchGitHubData);

    // Helper: Clean String -> Number
    function parseNum(val) {
      if (val === null || val === undefined) return 0;
      if (typeof val === 'number') return val;
      let s = String(val).replace(/,/g, '').replace(/%/g, '').trim();
      let n = parseFloat(s);
      return isNaN(n) ? 0 : n;
    }

    // Helper: Format comma separated integer
    function formatInt(val) {
      return Math.round(val).toLocaleString('en-US');
    }

    // Helper: Extract Date string from filename
    function extractDateStr(fileName) {
      let match = fileName.match(/(\d{8})/);
      return match ? match[1] : fileName;
    }

    // Toggle local file upload panel
    function toggleUploadMode() {
      isLocalMode = !isLocalMode;
      const ghPanel = document.getElementById('githubConfigPanel');
      const localPanel = document.getElementById('localUploadPanel');
      const toggleBtn = document.getElementById('toggleUploadBtn');

      if (isLocalMode) {
        ghPanel.classList.add('hidden');
        localPanel.classList.remove('hidden');
        toggleBtn.textContent = "➔ 使用 GitHub 遠端資料抓取";
      } else {
        ghPanel.classList.remove('hidden');
        localPanel.classList.add('hidden');
        toggleBtn.textContent = "使用 本機上傳 JSON 檔 ➔";
      }
    }

    // Process parsed JSON into normalized structure
    function processJsonObject(fileName, dateStr, jsonObj) {
      if (!jsonObj || typeof jsonObj !== 'object') return;

      // Handle root wrapper (e.g. { "981A": { "基金投資組合": [...] } })
      for (const [prefix, content] of Object.entries(jsonObj)) {
        let itemsList = [];

        if (Array.isArray(content)) {
          itemsList = content;
        } else if (typeof content === 'object' && content !== null) {
          const key = Object.keys(content).find(k => Array.isArray(content[k]));
          if (key) itemsList = content[key];
        }

        if (itemsList.length > 0) {
          let normalizedDict = {};
          itemsList.forEach(item => {
            let code = String(item["代號"] || item["股票代號"] || item["證券代號"] || "").trim();
            let name = String(item["名稱"] || item["股票名稱"] || item["證券名稱"] || "").trim();
            let shares = parseNum(item["股數"]);
            let weight = parseNum(item["權重"] || item["持股權重"] || item["權重(%)"]);

            if (code) {
              normalizedDict[code] = { code, name, shares, weight };
            }
          });

          parsedFilesData.push({
            prefix,
            dateStr,
            fileName,
            portfolio: normalizedDict
          });
        }
      }
    }

    // Action: Load Demo Data
    function loadDemoData() {
      parsedFilesData = [];
      for (const [fileName, jsonObj] of Object.entries(DEMO_FILES)) {
        let dateStr = extractDateStr(fileName);
        processJsonObject(fileName, dateStr, jsonObj);
      }
      postLoadProcessing("⚡ 已載入預設 Demo 測試資料 (5 期歷史記錄)");
    }

    // Action: Fetch Data from GitHub API
    async function fetchGitHubData() {
      const repo = document.getElementById('ghRepo').value.trim();
      const branch = document.getElementById('ghBranch').value.trim() || 'main';
      let folderPath = document.getElementById('ghFolderPath').value.trim();

      if (!repo || !repo.includes('/')) {
        updateBanner("⚠️ 請輸入正確的 GitHub Repository (例如 owner/repo)", "text-upColor", "bg-red-50");
        return;
      }

      updateBanner("⏳ 正從 GitHub 抓取檔案目錄列表中...", "text-primary", "bg-blue-50");

      try {
        if (folderPath && !folderPath.endsWith('/')) folderPath += '/';
        const apiUrl = `https://api.github.com/repos/${repo}/contents/${folderPath}?ref=${branch}`;

        const res = await fetch(apiUrl);
        if (!res.ok) throw new Error(`GitHub API 回應錯誤 (${res.status})`);

        const files = await res.json();
        if (!Array.isArray(files)) throw new Error("指定的路徑不是有效的資料夾目錄");

        // Filter JSON files
        const jsonFiles = files.filter(f => f.type === 'file' && f.name.endsWith('.json'));

        if (jsonFiles.length === 0) {
          updateBanner("⚠️ GitHub 資料夾內找不到任何 .json 檔案", "text-upColor", "bg-red-50");
          return;
        }

        // Sort files descending by date extracted from filename
        jsonFiles.sort((a, b) => {
          let dA = extractDateStr(a.name);
          let dB = extractDateStr(b.name);
          return dB.localeCompare(dA); // Newest first
        });

        // Determine maximum needed files (e.g. up to 60)
        const limitNeeded = parseInt(document.getElementById('compareLimitSelect').value, 10);
        const filesToFetch = jsonFiles.slice(0, limitNeeded);

        updateBanner(`⏳ 找到 ${jsonFiles.length} 個 JSON 檔案，正在下載最近 ${filesToFetch.length} 期資料...`, "text-primary", "bg-blue-50");

        parsedFilesData = [];
        for (const fileObj of filesToFetch) {
          const fileRes = await fetch(fileObj.download_url);
          const jsonObj = await fileRes.json();
          const dateStr = extractDateStr(fileObj.name);
          processJsonObject(fileObj.name, dateStr, jsonObj);
        }

        postLoadProcessing(`✅ 已成功從 GitHub 抓取 ${filesToFetch.length} 期持股資料！`);

      } catch (err) {
        console.error(err);
        updateBanner(`❌ 抓取失敗: ${err.message}`, "text-upColor", "bg-red-50");
      }
    }

    // Action: Local File Upload
    async function handleLocalFiles(e) {
      const files = Array.from(e.target.files).filter(f => f.name.endsWith('.json'));
      if (files.length === 0) return;

      document.getElementById('localFileCount').textContent = `已選擇 ${files.length} 個檔案`;
      parsedFilesData = [];

      for (const file of files) {
        try {
          const text = await file.text();
          const jsonObj = JSON.parse(text);
          const dateStr = extractDateStr(file.name);
          processJsonObject(file.name, dateStr, jsonObj);
        } catch (err) {
          console.error("Local JSON error:", file.name, err);
        }
      }

      postLoadProcessing(`📁 已從本機讀取 ${files.length} 個 JSON 檔`);
    }

    // Update Dropdown list after files loaded
    function postLoadProcessing(msg) {
      const prefixesSet = new Set(parsedFilesData.map(d => d.prefix));
      availablePrefixes = Array.from(prefixesSet).sort();

      const etfSelect = document.getElementById('etfSelect');
      etfSelect.innerHTML = '';

      availablePrefixes.forEach(prefix => {
        const opt = document.createElement('option');
        opt.value = prefix;
        opt.textContent = prefix;
        etfSelect.appendChild(opt);
      });

      if (availablePrefixes.length > 0) {
        analyzeAndRenderTable();
      } else {
        updateBanner("⚠️ 找不到合適的 ETF 持股資料", "text-upColor", "bg-red-50");
        document.getElementById('tableBody').innerHTML = '<tr><td colspan="10" class="p-6 text-center text-subText">無可比對資料</td></tr>';
      }
    }

    // Banner message update helper
    function updateBanner(text, textClass = "text-primary", bgClass = "bg-blue-50") {
      const banner = document.getElementById('infoBanner');
      banner.className = `px-4 py-2.5 rounded-lg border border-blue-100 text-xs font-semibold flex flex-col sm:flex-row items-start sm:items-center justify-between gap-1 ${bgClass} ${textClass}`;
      document.getElementById('bannerText').textContent = text;
    }

    // Core Analysis & Table Render
    function analyzeAndRenderTable() {
      const prefix = document.getElementById('etfSelect').value;
      const compareLimit = parseInt(document.getElementById('compareLimitSelect').value, 10);

      if (!prefix) return;

      // Filter for prefix and sort ascending by date
      let records = parsedFilesData.filter(d => d.prefix === prefix);
      records.sort((a, b) => a.dateStr.localeCompare(b.dateStr));

      const totalCount = records.length;
      if (totalCount === 0) {
        updateBanner(`[${prefix}] ⚠️ 無可用的歷史紀錄`, "text-upColor", "bg-red-50");
        return;
      }

      // Slice up to selected limit
      let selectedRecords = records;
      if (totalCount > compareLimit) {
        selectedRecords = records.slice(-compareLimit);
      }

      const dates = selectedRecords.map(r => r.dateStr);
      const formattedDates = dates.map(d => d.length === 8 ? `${d.substring(4,6)}/${d.substring(6,8)}` : d);

      // Status text
      let noticeText = totalCount < compareLimit 
        ? ` (總紀錄僅 ${totalCount} 期，已降級顯示最大個數)` 
        : ` (比對最新 ${selectedRecords.length} 期)`;

      updateBanner(
        `✅ [ETF ${prefix}] 分析區間：${formattedDates[0]} ～ ${formattedDates[formattedDates.length - 1]}${noticeText}`,
        "text-downColor",
        "bg-green-50"
      );

      // Dynamic Table Headers
      const headerRow = document.getElementById('tableHeaderRow');
      headerRow.innerHTML = `
        <th class="p-2.5 border-b cursor-pointer hover:bg-gray-200" onclick="sortTable(0)">股票代號 ⇕</th>
        <th class="p-2.5 border-b cursor-pointer hover:bg-gray-200" onclick="sortTable(1)">股票名稱 ⇕</th>
      `;

      // Build periods header
      const periods = [];
      for (let i = 0; i < selectedRecords.length - 1; i++) {
        const d1 = formattedDates[i];
        const d2 = formattedDates[i + 1];
        periods.push({
          prev: selectedRecords[i],
          curr: selectedRecords[i + 1]
        });
        const th = document.createElement('th');
        th.className = "p-2.5 text-center border-b font-semibold";
        th.textContent = `${d1} → ${d2}`;
        headerRow.appendChild(th);
      }

      // Weight diff header
      if (selectedRecords.length >= 2) {
        const thW = document.createElement('th');
        thW.className = "p-2.5 text-center border-b font-semibold text-textColor cursor-pointer hover:bg-gray-200";
        thW.textContent = `權重增減(${formattedDates[formattedDates.length - 2]}→${formattedDates[formattedDates.length - 1]}) ⇕`;
        thW.onclick = () => sortTable(2 + periods.length);
        headerRow.appendChild(thW);
      }

      // Collect unique stock codes
      const codesSet = new Set();
      selectedRecords.forEach(r => Object.keys(r.portfolio).forEach(c => codesSet.add(c)));

      const latestPortfolio = selectedRecords[selectedRecords.length - 1].portfolio;

      // Default sort by latest weight
      const sortedCodes = Array.from(codesSet).sort((a, b) => {
        let wA = latestPortfolio[a] ? latestPortfolio[a].weight : -1;
        let wB = latestPortfolio[b] ? latestPortfolio[b].weight : -1;
        return wB - wA;
      });

      // Prepare row objects
      currentFilteredRows = sortedCodes.map(code => {
        let stockName = "";
        for (let i = selectedRecords.length - 1; i >= 0; i--) {
          if (selectedRecords[i].portfolio[code]) {
            stockName = selectedRecords[i].portfolio[code].name;
            if (stockName) break;
          }
        }

        const periodDiffs = periods.map(p => {
          const prevItem = p.prev.portfolio[code];
          const currItem = p.curr.portfolio[code];

          if (!prevItem && currItem) {
            return { text: "新建倉", type: "NEW", val: 99999999 };
          } else if (prevItem && !currItem) {
            return { text: "已賣光", type: "SOLD", val: -99999999 };
          } else if (prevItem && currItem) {
            const diff = currItem.shares - prevItem.shares;
            if (diff > 0) return { text: `+${formatInt(diff)}`, type: "UP", val: diff };
            if (diff < 0) return { text: formatInt(diff), type: "DOWN", val: diff };
            return { text: "0", type: "ZERO", val: 0 };
          }
          return { text: "0", type: "ZERO", val: 0 };
        });

        // Weight Difference
        let weightDiffVal = 0;
        let weightDiffText = "-";
        if (selectedRecords.length >= 2) {
          const pPrev = selectedRecords[selectedRecords.length - 2].portfolio[code];
          const pCurr = selectedRecords[selectedRecords.length - 1].portfolio[code];
          const w1 = pPrev ? pPrev.weight : 0;
          const w2 = pCurr ? pCurr.weight : 0;
          weightDiffVal = parseFloat((w2 - w1).toFixed(2));

          if (weightDiffVal > 0) weightDiffText = `↑${weightDiffVal}%`;
          else if (weightDiffVal < 0) weightDiffText = `↓${Math.abs(weightDiffVal)}%`;
          else weightDiffText = `0.0%`;
        }

        return { code, name: stockName, periodDiffs, weightDiffVal, weightDiffText };
      });

      renderRows(currentFilteredRows);
      applyFilter();
    }

    // Render Table Rows
    function renderRows(rows) {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      if (rows.length === 0) {
        tbody.innerHTML = '<tr><td colspan="15" class="p-6 text-center text-subText">無符合篩選條件的標的</td></tr>';
        return;
      }

      rows.forEach(r => {
        const tr = document.createElement('tr');
        tr.className = "hover:bg-blue-50/50 transition border-b border-gray-100";

        // Code
        const tdCode = document.createElement('td');
        tdCode.className = "p-2.5 font-bold text-textColor text-center border-r border-gray-100";
        tdCode.textContent = r.code;
        tr.appendChild(tdCode);

        // Name
        const tdName = document.createElement('td');
        tdName.className = "p-2.5 font-medium text-textColor border-r border-gray-100";
        tdName.textContent = r.name;
        tr.appendChild(tdName);

        // Periods diffs
        r.periodDiffs.forEach(pd => {
          const td = document.createElement('td');
          td.className = "p-2.5 text-center font-medium border-r border-gray-100";

          if (pd.type === "UP") td.className += " text-upColor font-semibold";
          else if (pd.type === "DOWN") td.className += " text-downColor font-semibold";
          else if (pd.type === "NEW") td.className += " text-newColor font-bold bg-blue-50/60 rounded";
          else if (pd.type === "SOLD") td.className += " text-soldColor font-semibold";
          else td.className += " text-zeroColor";

          td.textContent = pd.text;
          tr.appendChild(td);
        });

        // Weight Difference
        if (r.weightDiffText !== "-") {
          const tdW = document.createElement('td');
          tdW.className = "p-2.5 text-center font-semibold";
          if (r.weightDiffVal > 0) tdW.className += " text-upColor";
          else if (r.weightDiffVal < 0) tdW.className += " text-downColor";
          else tdW.className += " text-zeroColor";

          tdW.textContent = r.weightDiffText;
          tr.appendChild(tdW);
        }

        tbody.appendChild(tr);
      });

      document.getElementById('recordCount').textContent = `共 ${rows.length} 檔標的`;
    }

    // Filter Logic
    function applyFilter() {
      const keyword = document.getElementById('filterInput').value.trim().toLowerCase();
      if (!keyword) {
        renderRows(currentFilteredRows);
        return;
      }

      const filtered = currentFilteredRows.filter(r => 
        r.code.toLowerCase().includes(keyword) || 
        r.name.toLowerCase().includes(keyword)
      );

      renderRows(filtered);
    }

    // Sort Table Logic
    function sortTable(colIndex) {
      sortDirections[colIndex] = !sortDirections[colIndex];
      const asc = sortDirections[colIndex];

      currentFilteredRows.sort((a, b) => {
        let vA, vB;
        if (colIndex === 0) {
          vA = a.code; vB = b.code;
        } else if (colIndex === 1) {
          vA = a.name; vB = b.name;
        } else {
          vA = a.weightDiffVal; vB = b.weightDiffVal;
        }

        if (typeof vA === 'string') {
          return asc ? vA.localeCompare(vB) : vB.localeCompare(vA);
        } else {
          return asc ? vA - vB : vB - vA;
        }
      });

      applyFilter();
    }
  </script>
</body>
</html>
