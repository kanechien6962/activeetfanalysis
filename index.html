<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETF Portfolio Analysis (GitHub JSON Version)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .table-cell-custom { padding: 6px 10px; white-space: nowrap; }
    </style>
</head>
<body class="bg-[#F5F6FA] text-[#1F2430] font-sans antialiased">
    <div class="max-w-7xl mx-auto p-4 sm:p-6 space-y-6">
        
        <!-- 頂部標題卡片 -->
        <div class="bg-white rounded-xl shadow-sm border border-[#E3E5EA] p-6 space-y-4">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                <div>
                    <h1 class="text-2xl font-bold text-[#1F2430]">ETF 投資組合變動分析</h1>
                    <p class="text-sm text-[#6B7280] mt-1">透過 GitHub JSON 資料自動比對各期持股與權重變化</p>
                </div>
                <!-- 比對個數選擇 -->
                <div class="flex items-center space-x-2">
                    <label class="text-sm font-semibold text-[#1F2430]">比對期數:</label>
                    <select id="compareLimitSelect" class="border border-[#E3E5EA] rounded-lg px-3 py-1.5 text-sm bg-white focus:outline-none focus:border-[#2F6FED]">
                        <option value="5" selected>最近 5 期</option>
                        <option value="10">最近 10 期</option>
                        <option value="20">最近 20 期</option>
                        <option value="60">最近 60 期</option>
                    </select>
                </div>
            </div>

            <!-- GitHub 設定列 -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-2 border-t border-[#E3E5EA]">
                <div>
                    <label class="block text-xs font-semibold text-[#6B7280] mb-1">GitHub Repo (owner/repo)</label>
                    <input type="text" id="ghRepoInput" value="kanechien6962/activeetfanalysis" class="w-full border border-[#E3E5EA] rounded-lg px-3 py-1.5 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-[#6B7280] mb-1">分支 (Branch)</label>
                    <input type="text" id="ghBranchInput" value="main" class="w-full border border-[#E3E5EA] rounded-lg px-3 py-1.5 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-[#6B7280] mb-1">資料夾路徑 (Folder Path)</label>
                    <div class="flex space-x-2">
                        <input type="text" id="ghPathInput" value="etf-data" class="w-full border border-[#E3E5EA] rounded-lg px-3 py-1.5 text-sm">
                        <button onclick="loadDataFromGitHub()" class="bg-[#2F6FED] hover:bg-[#255ACB] text-white px-4 py-1.5 rounded-lg text-sm font-semibold transition shrink-0">讀取</button>
                    </div>
                </div>
            </div>

            <!-- ETF 選擇與即時搜尋 -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
                <div class="flex items-center space-x-3">
                    <label class="text-sm font-semibold w-16 shrink-0">ETF 系列</label>
                    <select id="etfCombo" class="w-full border border-[#E3E5EA] rounded-lg px-3 py-1.5 text-sm bg-white focus:outline-none focus:border-[#2F6FED]">
                        <option value="">請先載入資料...</option>
                    </select>
                </div>
                <div class="flex items-center space-x-3">
                    <label class="text-sm font-semibold w-16 shrink-0">篩選標的</label>
                    <input type="text" id="searchInput" placeholder="輸入代號或名稱 (例: 2330 或 台積電)..." class="w-full border border-[#E3E5EA] rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:border-[#2F6FED]">
                </div>
            </div>
        </div>

        <!-- 狀態與提示訊息 -->
        <div id="infoLabel" class="text-sm text-[#6B7280] px-1 font-medium">請輸入 GitHub 資訊並點擊讀取按鈕</div>

        <!-- 表格容器 -->
        <div class="bg-white rounded-xl shadow-sm border border-[#E3E5EA] overflow-hidden">
            <div class="overflow-x-auto max-h-[600px]">
                <table id="dataTable" class="w-full text-left border-collapse text-sm">
                    <thead id="tableHeader" class="bg-[#F0F2F6] text-[#1F2430] sticky top-0 z-10 border-b border-[#E3E5EA]">
                        <tr>
                            <th class="table-cell-custom font-semibold">股票代號</th>
                            <th class="table-cell-custom font-semibold">股票名稱</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-[#E3E5EA]">
                        <!-- 動態生成列 -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 圖例說明 -->
        <div class="flex flex-wrap items-center gap-6 text-xs font-semibold px-1">
            <span class="text-[#E5484D]">● 加碼 / 權重增加</span>
            <span class="text-[#1A8754]">● 減碼 / 權重減少</span>
            <span class="text-[#2F6FED]">● 新建倉</span>
            <span class="text-[#9CA3AF]">● 已賣光</span>
        </div>
    </div>

    <script>
        let globalFilesData = {}; // 結構: { prefix: { dateStr: parsedObject } }
        let allFileDates = {};   // 結構: { prefix: [sorted dates] }
        let rawFilePaths = {};   // 結構: { prefix: { dateStr: download_url } }

        document.getElementById('etfCombo').addEventListener('change', renderTable);
        document.getElementById('searchInput').addEventListener('input', applyFilter);
        document.getElementById('compareLimitSelect').addEventListener('change', () => {
            if (Object.keys(globalFilesData).length > 0) {
                populateEtfComboAndRender();
            }
        });

        async function loadDataFromGitHub() {
            const repo = document.getElementById('ghRepoInput').value.trim();
            const branch = document.getElementById('ghBranchInput').value.trim() || 'main';
            const path = document.getElementById('ghPathInput').value.trim();
            const infoLabel = document.getElementById('infoLabel');

            if (!repo) {
                alert('請輸入 GitHub Repository (owner/repo)');
                return;
            }

            infoLabel.textContent = "正在向 GitHub 要求檔案清單...";
            infoLabel.className = "text-sm text-[#2F6FED] px-1 font-medium";

            const apiUrl = `https://api.github.com/repos/${repo}/contents/${path}?ref=${branch}`;

            try {
                const res = await fetch(apiUrl);
                if (!res.ok) throw new Error(`GitHub API 回應錯誤: ${res.statusText}`);
                const files = await res.json();

                if (!Array.isArray(files)) throw new Error("回傳格式不正確，請確認路徑是否為資料夾");

                // 篩選出類似 report_YYYYMMDD.json 的檔案
                const filePattern = /^(.*)_ETF_Investment_Portfolio_(\d{8})\.json$\vert{}^report_(\d{8})\.json$/;
                
                let matchedFiles = [];

                for (let file of files) {
                    const fname = file.name;
                    // 兼容原本的檔名或純日期格式 report_YYYYMMDD.json
                    let m = fname.match(/^(.*)_(\d{8})\.json$\vert{}^report_(\d{8})\.json$/);
                    if (m) {
                        let prefix = m[1] ? m[1] : "ETF";
                        let dateStr = m[2] ? m[2] : m[3];
                        matchedFiles.push({ prefix, dateStr, download_url: file.download_url });
                    }
                }

                if (matchedFiles.length === 0) {
                    infoLabel.textContent = "⚠ 找不到符合格式的 JSON 檔案（需為 *_YYYYMMDD.json 或 report_YYYYMMDD.json）";
                    infoLabel.className = "text-sm text-[#E5484D] px-1 font-medium";
                    return;
                }

                // 依照 Prefix 分組
                let grouped = {};
                for (let f of matchedFiles) {
                    if (!grouped[f.prefix]) grouped[f.prefix] = [];
                    grouped[f.prefix].push(f);
                }

                globalFilesData = {};
                allFileDates = {};
                rawFilePaths = {};

                const limitCount = parseInt(document.getElementById('compareLimitSelect').value) || 5;

                infoLabel.textContent = "正在下載並解析 JSON 內容...";

                for (let prefix in grouped) {
                    // 依日期排序
                    grouped[prefix].sort((a, b) => a.dateStr.localeCompare(b.dateStr));
                    
                    // 取最後 N 個檔案
                    let selected = grouped[prefix].slice(-limitCount);
                    
                    allFileDates[prefix] = selected.map(x => x.dateStr);
                    rawFilePaths[prefix] = {};
                    globalFilesData[prefix] = {};

                    for (let item of selected) {
                        rawFilePaths[prefix][item.dateStr] = item.download_url;
                        try {
                            const jsonRes = await fetch(item.download_url);
                            const jsonData = await jsonRes.json();
                            
                            // 解析結構支援多種層級
                            let parsed = parseJsonPortfolio(jsonData, prefix);
                            if (parsed) {
                                globalFilesData[prefix][item.dateStr] = parsed;
                            }
                        } catch (err) {
                            console.error(`解析檔案失敗 ${item.download_url}:`, err);
                        }
                    }
                }

                populateEtfComboAndRender();

            } catch (err) {
                console.error(err);
                infoLabel.textContent = "⚠ 讀取失敗：" + err.message;
                infoLabel.className = "text-sm text-[#E5484D] px-1 font-medium";
            }
        }

        function parseJsonPortfolio(jsonData, prefix) {
            // 嘗試尋找對應的 ETF 區塊或直接使用根物件
            let targetObj = null;
            if (jsonData[prefix]) {
                targetObj = jsonData[prefix];
            } else {
                // 尋找第一個含有陣列的 key
                let keys = Object.keys(jsonData);
                if (keys.length > 0) targetObj = jsonData[keys[0]];
            }

            if (!targetObj) return null;

            // 尋找陣列資料（例如 "基金投資組合" 或 "Sheet1" 或直接就是陣列）
            let itemsList = [];
            if (Array.isArray(targetObj)) {
                itemsList = targetObj;
            } else if (typeof targetObj === 'object') {
                for (let k in targetObj) {
                    if (Array.isArray(targetObj[k])) {
                        itemsList = targetObj[k];
                        break;
                    }
                }
            }

            if (!itemsList.length) return null;

            let result = {};
            for (let row of itemsList) {
                let code = String(row["代號"] || row["股票代號"] || row["證券代號"] || "").trim();
                if (!code) continue;

                let name = String(row["名稱"] || row["股票名稱"] || row["證券名稱"] || "").trim();
                let sharesStr = String(row["股數"] || "0").replace(/,/g, "");
                let shares = parseFloat(sharesStr) || 0;

                let weightStr = String(row["權重"] || row["持股權重"] || "0").replace(/%|,/g, "");
                let weight = parseFloat(weightStr) || 0;

                result[code] = { "股數": shares, "持股權重": weight, "股票名稱": name };
            }

            return result;
        }

        function populateEtfComboAndRender() {
            const etfCombo = document.getElementById('etfCombo');
            etfCombo.innerHTML = "";

            let prefixes = Object.keys(globalFilesData);
            if (prefixes.length === 0) {
                etfCombo.innerHTML = `<option value="">無可用資料</option>`;
                return;
            }

            for (let p of prefixes) {
                let opt = document.createElement('option');
                opt.value = p;
                opt.textContent = `ETF 系列: ${p}`;
                etfCombo.appendChild(opt);
            }

            renderTable();
        }

        function renderTable() {
            const prefix = document.getElementById('etfCombo').value;
            const infoLabel = document.getElementById('infoLabel');
            if (!prefix || !globalFilesData[prefix]) return;

            const limitCount = parseInt(document.getElementById('compareLimitSelect').value) || 5;
            let dates = allFileDates[prefix] || [];
            
            // 根據選取的個數截取最近的 N 個
            if (dates.length > limitCount) {
                dates = dates.slice(-limitCount);
            }

            let formattedDates = dates.map(d => `${d.substring(4, 6)}/${d.substring(6, 8)}`);
            let dfs = globalFilesData[prefix];

            if (dates.length < 2) {
                infoLabel.textContent = `[${prefix}] ⚠ 檔案數量不足 2 個，無法進行期數比較`;
                infoLabel.className = "text-sm text-[#E5484D] px-1 font-medium";
                document.getElementById('tableBody').innerHTML = "";
                return;
            }

            infoLabel.textContent = `[${prefix}] ✅ 已載入 ${dates.length} 個檔案 ｜ 分析區間：${formattedDates[0]} ～ ${formattedDates[-1]}`;
            infoLabel.className = "text-sm text-[#1A8754] font-semibold px-1";

            // 收集所有股票代號
            let allCodes = new Set();
            for (let d of dates) {
                if (dfs[d]) {
                    Object.keys(dfs[d]).forEach(c => allCodes.add(c));
                }
            }

            // 以最新一期的權重排序
            let latestData = dfs[dates[dates.length - 1]] || {};
            let sortedCodes = Array.from(allCodes).sort((a, b) => {
                let wA = latestData[a] ? latestData[a]["持股權重"] : -1;
                let wB = latestData[b] ? latestData[b]["持股權重"] : -1;
                return wB - wA;
            });

            // 建立表頭
            let colHeaders = ["股票代號", "股票名稱"];
            let comparisonPeriods = [];
            for (let i = 0; i < dates.length - 1; i++) {
                comparisonPeriods.push({ prev: dates[i], curr: dates[i+1] });
                colHeaders.push(`${formattedDates[i]} → ${formattedDates[i+1]}`);
            }
            colHeaders.push(`權重增減 (${formattedDates[-2]}→${formattedDates[-1]})`);

            let theadHtml = "<tr>";
            colHeaders.forEach(h => {
                theadHtml += `<th class="table-cell-custom font-semibold text-center">${h}</th>`;
            });
            theadHtml += "</tr>";
            document.getElementById('tableHeader').innerHTML = theadHtml;

            // 建立表格內容
            let tbodyHtml = "";
            sortedCodes.forEach(code => {
                let stockName = "";
                for (let i = dates.length - 1; i >= 0; i--) {
                    if (dfs[dates[i]] && dfs[dates[i]][code] && dfs[dates[i]][code]["股票名稱"]) {
                        stockName = dfs[dates[i]][code]["股票名稱"];
                        break;
                    }
                }

                tbodyHtml += `<tr class="hover:bg-[#F9FAFB] transition" data-code="${code.toLowerCase()}" data-name="${stockName.toLowerCase()}">`;
                tbodyHtml += `<td class="table-cell-custom text-center font-bold">${code}</td>`;
                tbodyHtml += `<td class="table-cell-custom text-left">${stockName}</td>`;

                // 各期股數變化
                comparisonPeriods.forEach(p => {
                    let dPrev = dfs[p.prev];
                    let dCurr = dfs[p.curr];
                    let inPrev = dPrev && dPrev[code];
                    let inCurr = dCurr && dCurr[code];

                    let valStr = "0";
                    let colorClass = "text-[#C9CDD4]";
                    let isBold = false;

                    if (!inPrev && inCurr) {
                        valStr = "新建倉";
                        colorClass = "text-[#2F6FED]";
                        isBold = true;
                    } else if (inPrev && !inCurr) {
                        valStr = "已賣光";
                        colorClass = "text-[#9CA3AF]";
                    } else if (inPrev && inCurr) {
                        let diff = Math.round(dCurr[code]["股數"] - dPrev[code]["股數"]);
                        if (diff > 0) {
                            valStr = `+${diff.toLocaleString()}`;
                            colorClass = "text-[#E5484D]";
                        } else if (diff < 0) {
                            valStr = `${diff.toLocaleString()}`;
                            colorClass = "text-[#1A8754]";
                        } else {
                            valStr = "0";
                        }
                    }

                    tbodyHtml += `<td class="table-cell-custom text-center ${colorClass} ${isBold ? 'font-bold' : ''}">${valStr}</td>`;
                });

                // 最後一期權重增減
                let lastDiffStr = "-";
                let lastDiffColor = "text-[#C9CDD4]";
                if (dates.length >= 2) {
                    let sLastD = dates[dates.length - 2];
                    let lastD = dates[dates.length - 1];
                    let wPrev = (dfs[sLastD] && dfs[sLastD][code]) ? dfs[sLastD][code]["持股權重"] : 0;
                    let wCurr = (dfs[lastD] && dfs[lastD][code]) ? dfs[lastD][code]["持股權重"] : 0;
                    let wDiff = Math.round((wCurr - wPrev) * 100) / 100;

                    if (wDiff > 0) {
                        lastDiffStr = `↑${wDiff}%`;
                        lastDiffColor = "text-[#E5484D]";
                    } else if (wDiff < 0) {
                        lastDiffStr = `↓${Math.abs(wDiff)}%`;
                        lastDiffColor = "text-[#1A8754]";
                    } else {
                        lastDiffStr = "0.0%";
                    }
                }
                tbodyHtml += `<td class="table-cell-custom text-center font-semibold ${lastDiffColor}">${lastDiffStr}</td>`;
                tbodyHtml += `</tr>`;
            });

            document.getElementById('tableBody').innerHTML = tbodyHtml;
            applyFilter();
        }

        function applyFilter() {
            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
            const rows = document.querySelectorAll('#tableBody tr');
            let visibleCount = 0;

            rows.forEach(row => {
                let code = row.getAttribute('data-code') || "";
                let name = row.getAttribute('data-name') || "";
                if (code.includes(keyword) || name.includes(keyword)) {
                    row.style.display = "";
                    visibleCount++;
                } else {
                    row.style.display = "none";
                }
            });
        }
    </script>
</body>
</html>
